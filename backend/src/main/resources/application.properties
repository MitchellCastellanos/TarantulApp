app.partner-sync.cron=${PARTNER_SYNC_CRON:0 */30 * * * *}
# ─── Taxonomy discovery (sibling of TaxonomySyncService) ────────────────────
# Whitelist mode runs weekly (default Sun 05:30) and upserts curated hobby names from
# backend/src/main/resources/taxonomy/discovery_whitelist.txt. Family-wide mode is opt-in
# and paginates accepted Theraphosidae from GBIF monthly. Both share the same throttle
# (default 1000 ms between API calls) to respect iNat's 1 req/s soft cap.
app.taxonomy-discovery.enabled=${TAXONOMY_DISCOVERY_ENABLED:true}
app.taxonomy-discovery.whitelist-cron=${TAXONOMY_DISCOVERY_WHITELIST_CRON:0 30 5 * * SUN}
app.taxonomy-discovery.whitelist-path=${TAXONOMY_DISCOVERY_WHITELIST_PATH:classpath:taxonomy/discovery_whitelist.txt}
app.taxonomy-discovery.throttle-ms=${TAXONOMY_DISCOVERY_THROTTLE_MS:1000}
app.taxonomy-discovery.family-wide.enabled=${TAXONOMY_DISCOVERY_FAMILY_WIDE_ENABLED:false}
app.taxonomy-discovery.family-wide-cron=${TAXONOMY_DISCOVERY_FAMILY_WIDE_CRON:0 0 6 1 * *}
app.taxonomy-discovery.family-wide.page-size=${TAXONOMY_DISCOVERY_FAMILY_WIDE_PAGE_SIZE:100}
app.taxonomy-discovery.family-wide.max-pages=${TAXONOMY_DISCOVERY_FAMILY_WIDE_MAX_PAGES:25}
# One-shot trigger on app startup. Values: none | whitelist | family-wide | both. Set to e.g. "both"
# in Railway, redeploy, watch logs for completion, then unset to avoid re-running on every restart.
app.taxonomy-discovery.run-on-startup=${TAXONOMY_DISCOVERY_RUN_ON_STARTUP:none}
app.partner-sync.adapters.static.enabled=${PARTNER_SYNC_ADAPTER_STATIC_ENABLED:true}
app.partner-sync.adapters.mock.enabled=${PARTNER_SYNC_ADAPTER_MOCK_ENABLED:true}
