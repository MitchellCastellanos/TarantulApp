# any caller to PRO with a `test_*` token. Set to false only after server-side verify lands.
billing.google-play.production-stub-guard=${PLAY_BILLING_PRODUCTION_STUB_GUARD:true}

# ─── Google Workspace — Play testing group (Admin SDK Directory API) ─────────
# Set ONLY on the Java backend host (Railway/Fly/etc.) — NOT on Vercel (frontend has no JVM).
# Either paste the full JSON as GOOGLE_WORKSPACE_SERVICE_ACCOUNT_JSON (recommended on Railway), or set:
# GOOGLE_CLIENT_EMAIL, GOOGLE_PRIVATE_KEY, GOOGLE_ADMIN_IMPERSONATE_EMAIL, GOOGLE_TESTERS_GROUP_EMAIL.
# private_key: PKCS#8 PEM from the same JSON as client_email. Also set from that JSON (avoids 401 on token):
# GOOGLE_SERVICE_ACCOUNT_CLIENT_ID (field client_id), optional GOOGLE_SERVICE_ACCOUNT_PROJECT_ID (project_id),
# GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_ID (private_key_id).
# Railway: multiline PEM is best; one-line PEM uses literal \n between lines.
# Domain-wide delegation must include https://www.googleapis.com/auth/admin.directory.group.member

# ─── Environment label (used by safety guards / Sentry / logs) ──────────────
# Falls back to spring.profiles.active when not explicitly set.
app.environment=${APP_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:development}}

# ─── Redis (rate limit + cache + ShedLock + token blacklist) ────────────────
# Disabled by default so dev / CI / first-deploy work without provisioning Redis. When
# REDIS_URL is set in Railway, also set APP_REDIS_ENABLED=true; without that flag the app
# silently falls back to in-memory implementations (and a single replica is fine).
# Format: redis://[:password@]host:port[/db] or rediss:// for TLS (Upstash).
app.redis.enabled=${APP_REDIS_ENABLED:false}
app.redis.url=${REDIS_URL:}

# ─── hCaptcha (anti-abuso en register / forgot-password) ────────────────────
# Deja CAPTCHA_SECRET vacio para desactivar (dev/CI). En produccion: crea un site key en
# hcaptcha.com (free tier) y exporta el secret aqui. El frontend leera VITE_HCAPTCHA_SITE_KEY.
# Compatible con reCAPTCHA si cambias verify-url a https://www.google.com/recaptcha/api/siteverify.
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:https://hcaptcha.com/siteverify}
# Override opcional: vacio = inferido (enabled si hay secret).
app.captcha.enabled=${CAPTCHA_ENABLED:}

# ─── Sex ID LLM (texto barato + fallback a heuristicas) ─────────────────────
app.sex-id.llm.enabled=${SEX_ID_LLM_ENABLED:false}
app.sex-id.llm.api-url=${SEX_ID_LLM_API_URL:https://api.openai.com/v1/chat/completions}
app.sex-id.llm.model=${SEX_ID_LLM_MODEL:gpt-4o-mini}
app.sex-id.llm.api-key=${SEX_ID_LLM_API_KEY:}

# ─── Overrides solo en tu máquina (gitignored) ──────────────────────────────
# Si application-local.properties define spring.datasource.url, SOBRESCRIBE DB_URL del entorno.
spring.config.import=optional:classpath:application-local.properties
