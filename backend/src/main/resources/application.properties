app.marketplace.future-paid-storefront-enabled=${MARKETPLACE_FUTURE_PAID_STOREFRONT_ENABLED:false}
app.marketplace.future-paid-badges-enabled=${MARKETPLACE_FUTURE_PAID_BADGES_ENABLED:false}
app.marketplace.partner-feed.hard-cap=${MARKETPLACE_PARTNER_FEED_HARD_CAP:50}
app.marketplace.partner-feed.share.bootstrap-under-10=${MARKETPLACE_PARTNER_FEED_SHARE_BOOTSTRAP_UNDER_10:0.60}
app.marketplace.partner-feed.share.warm-under-25=${MARKETPLACE_PARTNER_FEED_SHARE_WARM_UNDER_25:0.40}
app.marketplace.partner-feed.share.growth-under-60=${MARKETPLACE_PARTNER_FEED_SHARE_GROWTH_UNDER_60:0.25}
app.marketplace.partner-feed.share.steady-60-plus=${MARKETPLACE_PARTNER_FEED_SHARE_STEADY_60_PLUS:0.15}

# ─── Usuario de prueba local (ver LocalDevUserSeed) ─────────────────────────
# Por defecto false. Requiere además spring.profiles.active=local (o dev) — ver .SAMPLE
# Preferido: TARANTULAPP_DEV_SEED_USER=true (menos colisión que DEV_SEED_* genérico)
app.dev-seed-user=${TARANTULAPP_DEV_SEED_USER:${DEV_SEED_USER:false}}

# ─── Server ─────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# Defer Spring bean creation (JPA proxy, MVC, Security) until first request.
# Cuts startup peak memory ~40%, preventing OOM kills in constrained containers.
# JPA EntityManagerFactory + Flyway still run eagerly (DDL validate happens at startup).
#
# Trade-off: lazy init defers CGLIB proxy class generation (for @Transactional / @Cacheable /
# @Async beans) to the first request that hits each bean. Those classes go into Metaspace.
# When diagnosing OOM: Metaspace, flip APP_LAZY_INIT=false so all proxies are generated at
# startup and the runtime class-loading curve flattens. The container needs ~40 % more peak
# RAM at startup in that mode.
spring.main.lazy-initialization=${APP_LAZY_INIT:true}
# Tomcat sizing — defaults (200/10/8192/100) are fine but pinning makes capacity planning explicit.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:10}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:20000}
# Graceful shutdown drains in-flight requests before SIGTERM kills the process (Railway redeploys).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_GRACE_PERIOD:30s}

# ─── Actuator (observability) ───────────────────────────────────────────────
# /actuator/health/{liveness,readiness} and the aggregate /actuator/health are public
# (UptimeRobot, k8s probes, Railway/Fly). Everything else (info, metrics, prometheus)
# requires header X-Admin-Token matching MANAGEMENT_TOKEN. If MANAGEMENT_TOKEN is empty
# those endpoints are permanently blocked (403).
#
# Railway / deploy probes: use GET /actuator/health/liveness (see backend/railway.toml).
# The aggregate GET /actuator/health includes the DB health indicator; if the DB is
# unreachable or reports DOWN, Spring returns HTTP 503 and Railway marks the replica unhealthy.
# Alternative: set MANAGEMENT_HEALTH_DB_ENABLED=false to take DB out of the aggregate.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Disable the auto-registered MailHealthIndicator: it opens an SMTP socket on every
# /actuator/health hit and our Ionos host (and most providers) takes ~135s to time out,
# which exhausts Railway's 5-minute healthcheck window and the app never reports healthy.
# Mail problems are surfaced by send failures + Sentry breadcrumbs, not by polling SMTP.
management.health.mail.enabled=false
management.info.env.enabled=true
management.info.git.mode=simple
# JVM memory + class-loader binders. With MaxMetaspaceSize=256m we want to see Metaspace
# usage in Prometheus (jvm_memory_used_bytes{area="nonheap",id="Metaspace"}) before it OOMs.
management.metrics.enable.jvm.memory=true
management.metrics.enable.jvm.classes=true
management.metrics.enable.jvm.gc=true
management.metrics.enable.jvm.threads=true
management.metrics.tags.application=${spring.application.name:tarantulapp-backend}
app.management.token=${MANAGEMENT_TOKEN:}
info.app.name=${spring.application.name:tarantulapp-backend}
info.app.version=@project.version@

# ─── Observability: correlation id + structured logs ────────────────────────
# Set LOG_FORMAT=json in production (Railway, Fly.io) to enable JSON log output for aggregation
# (Better Stack, Grafana Loki, Papertrail). Default "text" keeps local development readable.
app.log-format=${LOG_FORMAT:text}

# ─── Sentry (error tracking) ────────────────────────────────────────────────
# Leave SENTRY_DSN empty to disable. When set, backend unhandled exceptions are captured automatically.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:development}}
sentry.release=${SENTRY_RELEASE:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
sentry.send-default-pii=false
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
# Cap retained per-thread breadcrumb buffers. Default is 100, which on a pooled Tomcat thread
# with high request volume keeps ~100 strings * thread-count alive between requests until the
# scope is cleared (handled now in CorrelationIdFilter). 25 is plenty for triage and bounds RAM.
sentry.max-breadcrumbs=${SENTRY_MAX_BREADCRUMBS:25}
# Cap on-disk caching of unsent envelopes so a Sentry outage cannot fill the container disk.
sentry.max-cache-items=${SENTRY_MAX_CACHE_ITEMS:30}
# Truncate strings before serialization (request bodies, stack frames). Default is unlimited
# which can balloon event payloads to MB-class when controllers receive large JSON.
sentry.max-request-body-size=${SENTRY_MAX_REQUEST_BODY_SIZE:small}
sentry.attach-stacktrace=${SENTRY_ATTACH_STACKTRACE:true}

# ─── Email (SMTP: reset password, trials, admin notices) ────────────────────
# Producción (Railway / Fly): define MAIL_USERNAME + MAIL_PASSWORD — si están vacíos,
# ningún correo saldrá y verás errores en logs al intentar enviar.
#
# IONOS (recomendado puerto 587 + STARTTLS):
#   MAIL_HOST=smtp.ionos.com
#   MAIL_PORT=587
#   MAIL_USERNAME=tu-correo@tudominio.com
#   MAIL_PASSWORD=<contraseña del buzón o de app si IONOS la ofrece>
#   MAIL_FROM=tu-correo@tudominio.com
#   (El remitente suele tener que coincidir con el buzón autenticado.)
# SSL puerto 465 (IONOS / otros): MAIL_PORT=465, MAIL_SMTP_SSL=true,
# MAIL_STARTTLS_ENABLE=false — ver docs/operations/smtp-ionos-railway.md si 587 hace timeout desde Railway.
#
# Gmail: host=smtp.gmail.com, port=587, password=contraseña de aplicación.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:15000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:15000}

resend.api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:noreply@tarantulapp.com}
app.mail.from-name=${MAIL_FROM_NAME:TarantulApp}
app.mail.reply-to=${MAIL_REPLY_TO:support@tarantulapp.com}
app.mail.admin-notify-to=${MAIL_ADMIN_NOTIFY_TO:admin@tarantulapp.com}
app.trial-reminder.enabled=${TRIAL_REMINDER_ENABLED:true}
app.trial-reminder.cron=${TRIAL_REMINDER_CRON:0 0 9 * * *}
# URL base del frontend (para el link en el email)
